"$schema": "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Primary Card
status: stable
group: UBC Web Services
description: Component to render as a Primary Card
props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: The title of the card
    titlePrefix:
      type: string
      title: Title prefix
      description: The prefix to the card title
    titleSuffix:
      type: string
      title: Title suffix
      description: The suffix to the card title
    subtitle:
      type: string
      title: Subtitle
      description: The subtitle of the card
    link:
      type: string
      title: Link
      description: The destination of the card link
      examples:
        - https://ubc.ca
    target:
      type: boolean
      title: Target
      description: Open the link in a new tab
    meta:
      type: string
      title: Metadata
      description: The metadata for the card (date, tag, etc)
    imageZoom:
      type: boolean
      title: Image Zoom
      description: Add the image zoom effect
    noShadow:
      type: boolean
      title: Remove Card Shadow
      description: Remove the card shadow effect
    color:
      type: string
      title: Card color
      description: The background color of the card
      enum:
        - 'bg-transparent bg-light'
        - 'bg-white bg-light'
        - 'bg-unit-primary bg-dark'
        - 'bg-unit-primary bg-light'
        - 'bg-unit-secondary bg-light'
        - 'bg-unit-secondary bg-dark'
        - 'bg-unit-tertiary bg-light'
        - 'bg-unit-tertiary bg-dark'
        - 'bg-unit-accent bg-light'
        - 'bg-unit-accent bg-dark'
        - 'bg-ubc-blue bg-dark'
        - 'bg-ubc-blue-sea bg-dark'
        - 'bg-ubc-blue-cobalt bg-dark'
        - 'bg-ubc-blue-neptune bg-dark'
        - 'bg-ubc-blue-cornflower bg-light'
        - 'bg-ubc-blue-polar bg-light'
        - 'bg-ubc-blue-frost bg-light'
        - 'bg-grey-100 bg-light'
      meta:enum:
        'bg-transparent bg-light': No background
        'bg-white bg-light': White background
        'bg-unit-primary bg-dark': Unit Primary background
        'bg-unit-primary bg-light': Unit Primary (light) background
        'bg-unit-secondary bg-dark': Unit Secondary background
        'bg-unit-secondary bg-light': Unit Secondary (light) background
        'bg-unit-tertiary bg-dark': Unit Tertiary background
        'bg-unit-tertiary bg-light': Unit Tertiary (light) background
        'bg-unit-accent bg-dark': Unit Accent background
        'bg-unit-accent bg-light': Unit Accent (light) background
        'bg-ubc-blue bg-dark': UBC Blue background
        'bg-ubc-blue-sea bg-dark': 'UBC Blue: Sea background'
        'bg-ubc-blue-cobalt bg-dark': 'UBC Blue: Cobalt background'
        'bg-ubc-blue-neptune bg-dark': 'UBC Blue: Neptune background'
        'bg-ubc-blue-cornflower bg-light': 'UBC Blue: Cornflower background'
        'bg-ubc-blue-polar bg-light': 'UBC Blue: Polar background'
        'bg-ubc-blue-frost bg-light': 'UBC Blue: Frost background'
        'bg-grey-100 bg-light': 'Grey: 100 background'
      default: 'bg-transparent bg-light'
      examples: ['bg-ubc-blue bg-dark']
    layout:
      type: string
      title: Layout
      description: Choose the card layout
      enum:
        - ubc-card--vert
        - ubc-card--horiz
        - ubc-card--horiz-rev
      meta:enum:
        'ubc-card--vert': Vertical
        'ubc-card--horiz': Horizontal
        'ubc-card--horiz-rev': Horizontal, reversed
      examples: ['ubc-card--vert']
      default: ubc-card--vert
    customClasses:
      title: Custom Classes
      type: string
      description: Custom classes to apply to the card
      examples:
        - my-class another-class
slots:
  media:
    title: Image Content
    description: The image / media content
  content:
    title: Card Content
    required: true
    description: The card content
  actions:
    title: Card Actions
    description: The card actions
libraryOverrides:
  dependencies:
    - kraken/global
